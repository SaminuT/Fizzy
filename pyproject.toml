[project]
name = "fizzy"
version = "1.0.0"
description = "An AI helper that sits beside your cursor on Windows."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SaminuT", email = "saminuhansaja.w@gmail.com" }]
license = { text = "MIT" }
dynamic = ["dependencies"]

[project.scripts]
fizzy = "fizzy.app:main"

[project.urls]
Homepage = "https://github.com/Owask/Fizzy"
Issues = "https://github.com/Owask/Fizzy/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["fizzy*"]

[tool.setuptools.package-data]
"fizzy.prompts" = ["*.md"]
